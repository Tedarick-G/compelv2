name: Compel KV Güncelle

on:
  schedule:
    - cron: '40 12 * * *'   # 15:40 TR TEST
  workflow_dispatch:
    inputs:
      marka:
        description: 'Marka slug; boş bırakırsan tüm markalar'
        required: false
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Compel KV Güncelle
        env:
          WORKER: ${{ secrets.WORKER_URL }}
          MARKA: ${{ github.event.inputs.marka }}
        run: |
          node << 'JS'
          const WORKER = (process.env.WORKER || '').replace(/\/+$/, '');
          const MARKA = (process.env.MARKA || '').trim();
          const DELAY = 3000;

          const DYN_FIELDS = 'urun_linki,varyant_adi,sku,ean,guncel_fiyat,usd_kdv_haric,eur_kdv_haric,stok';

          if (!WORKER) throw new Error('WORKER_URL secret eksik');

          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function getJson(url, opt = {}) {
            const r = await fetch(url, opt);
            const text = await r.text();

            console.log(`[HTTP ${r.status}] ${url}`);

            if (!r.ok) throw new Error(`HTTP ${r.status}: ${text.slice(0,300)}`);

            try {
              return JSON.parse(text);
            } catch {
              throw new Error(`JSON okunamadı: ${text.slice(0,300)}`);
            }
          }

          async function readKV(slug) {
            const r = await fetch(`${WORKER}?get=${encodeURIComponent(slug)}`);
            const text = await r.text();

            console.log(`[KV get] ${slug} HTTP ${r.status}`);

            if (r.status === 404) return null;
            if (!r.ok) throw new Error(`KV get HTTP ${r.status}: ${text.slice(0,300)}`);

            try {
              return JSON.parse(text);
            } catch {
              return null;
            }
          }

          async function writeKV(slug, data) {
            await getJson(`${WORKER}?set=${encodeURIComponent(slug)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            });
          }

          async function getBrands() {
            const data = await getJson(`${WORKER}?brands`);
            return (data.brands || []).map(b => b.slug).filter(Boolean);
          }

          function groupByLink(rows) {
            const map = new Map();

            for (const u of rows || []) {
              if (!u.urun_linki) continue;
              if (!map.has(u.urun_linki)) map.set(u.urun_linki, []);
              map.get(u.urun_linki).push(u);
            }

            return map;
          }

          function norm(v) {
            return String(v || '').toLowerCase().replace(/\s+/g, ' ').trim();
          }

          function matchRow(oldRow, freshRows) {
            if (!freshRows.length) return null;

            if (oldRow.sku) {
              const x = freshRows.find(r => String(r.sku || '') === String(oldRow.sku || ''));
              if (x) return x;
            }

            if (oldRow.ean) {
              const x = freshRows.find(r => String(r.ean || '') === String(oldRow.ean || ''));
              if (x) return x;
            }

            if (oldRow.varyant_adi) {
              const x = freshRows.find(r => norm(r.varyant_adi) === norm(oldRow.varyant_adi));
              if (x) return x;
            }

            return freshRows.length === 1 ? freshRows[0] : null;
          }

          async function updateMarka(slug) {
            console.log(`Marka: ${slug}`);

            const oldData = await readKV(slug);

            if (!oldData || !(oldData.urunler || []).length) {
              console.log(`  KV yok veya boş, atlanıyor`);
              return;
            }

            const groups = groupByLink(oldData.urunler);
            const finalRows = [];

            let i = 0;

            for (const [link, rows] of groups) {
              i++;

              try {
                const data = await getJson(`${WORKER}?u=${encodeURIComponent(link)}&fields=${encodeURIComponent(DYN_FIELDS)}`);
                const freshRows = (Array.isArray(data) ? data : [data]).filter(x => x && x.urun_linki);

                for (const oldRow of rows) {
                  const fresh = matchRow(oldRow, freshRows);

                  if (!fresh) {
                    finalRows.push(oldRow);
                    continue;
                  }

                  finalRows.push({
                    ...oldRow,
                    sku: oldRow.sku || fresh.sku || '',
                    ean: oldRow.ean || fresh.ean || '',
                    guncel_fiyat: fresh.guncel_fiyat ?? oldRow.guncel_fiyat,
                    usd_kdv_haric: fresh.usd_kdv_haric ?? oldRow.usd_kdv_haric,
                    eur_kdv_haric: fresh.eur_kdv_haric ?? oldRow.eur_kdv_haric,
                    stok: fresh.stok ?? oldRow.stok
                  });
                }

                console.log(`  ${i}/${groups.size} güncellendi`);
              } catch (e) {
                console.warn(`  Güncellenemedi: ${link} - ${e.message}`);
                finalRows.push(...rows);
              }

              await sleep(DELAY);
            }

            const now = new Date().toISOString();

            const body = {
              ...oldData,
              brand: oldData.brand || slug,
              guncelleme: now,
              updated_at: now,
              mode: 'refresh',
              urunler: finalRows
            };

            await writeKV(slug, body);

            console.log(`  KV yazıldı: ${finalRows.length} satır`);
          }

          async function main() {
            console.log(`WORKER: ${WORKER}`);
            console.log(`MARKA: ${MARKA || '(tüm markalar)'}`);

            const brands = MARKA ? [MARKA] : await getBrands();

            console.log(`${brands.length} marka işlenecek`);

            for (const slug of brands) {
              await updateMarka(slug);
              await sleep(DELAY);
            }

            console.log('Tamamlandı');
          }

          main().catch(e => {
            console.error(e);
            process.exit(1);
          });
          JS
