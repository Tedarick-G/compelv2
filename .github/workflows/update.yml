name: Compel KV Guncelle

on:
  schedule:
    - cron: '0 12 * * *'   # 15:10 TR
  workflow_dispatch:
    inputs:
      marka:
        description: 'Marka slug; bos birakirsan otomatik siradaki marka'
        required: false
        default: ''

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Compel KV Guncelle
        env:
          WORKER: ${{ secrets.WORKER_URL }}
          MARKA: ${{ github.event.inputs.marka }}
        run: |
          node << 'JS'
          const W = (process.env.WORKER || '').replace(/\/+$/, '');
          const M = (process.env.MARKA || '').trim();
          const F = 'urun_linki,varyant_adi,sku,ean,guncel_fiyat,usd_kdv_haric,eur_kdv_haric,stok';

          const BRANDS = [
            'rode','hosa','ssl','warm-audio','audient','arturia','numark','stanton',
            'presonus','ik-multimedia','steinberg','yamaha','krk','neumann',
            'sennheiser','behringer','akai','alesis','m-audio','korg','nord',
            'focusrite','adam-audio','mackie','shure','audio-technica','tascam','zoom'
          ];

          if (!W) throw new Error('WORKER_URL secret eksik');

          const wait = ms => new Promise(r => setTimeout(r, ms));
          const rnd = (a,b) => a + Math.floor(Math.random() * (b - a + 1));
          const pick = () => BRANDS[Math.floor(Date.now() / 86400000) % BRANDS.length];

          async function json(url, opt) {
            const r = await fetch(url, opt);
            const t = await r.text();
            console.log(`[${r.status}] ${url}`);
            if (!r.ok) throw new Error(t.slice(0,300));
            return JSON.parse(t);
          }

          async function retry(url) {
            try {
              return await json(url);
            } catch (e) {
              if (!String(e.message).includes('403')) throw e;
              console.log('403 alindi, 60 sn bekleniyor...');
              await wait(60000);
              return await json(url);
            }
          }

          async function getKV(slug) {
            const r = await fetch(`${W}?get=${encodeURIComponent(slug)}`);
            const t = await r.text();
            console.log(`[KV ${r.status}] ${slug}`);
            if (r.status === 404) return null;
            if (!r.ok) throw new Error(t.slice(0,300));
            return JSON.parse(t);
          }

          async function setKV(slug, body) {
            await json(`${W}?set=${encodeURIComponent(slug)}`, {
              method: 'POST',
              headers: {'Content-Type':'application/json'},
              body: JSON.stringify(body)
            });
          }

          const n = v => String(v || '').toLowerCase().replace(/\s+/g,' ').trim();

          function match(old, fresh) {
            return fresh.find(x => old.sku && x.sku == old.sku)
              || fresh.find(x => old.ean && x.ean == old.ean)
              || fresh.find(x => old.varyant_adi && n(x.varyant_adi) == n(old.varyant_adi))
              || (fresh.length == 1 ? fresh[0] : null);
          }

          async function run(slug) {
            console.log(`Marka: ${slug}`);

            const old = await getKV(slug);
            if (!old || !(old.urunler || []).length) {
              console.log('KV yok veya bos, atlandi');
              return;
            }

            const groups = new Map();
            for (const u of old.urunler) {
              if (!u.urun_linki) continue;
              if (!groups.has(u.urun_linki)) groups.set(u.urun_linki, []);
              groups.get(u.urun_linki).push(u);
            }

            const out = [];
            let i = 0;

            for (const [link, rows] of groups) {
              i++;

              try {
                const url = `${W}?u=${encodeURIComponent(link)}&fields=${encodeURIComponent(F)}`;
                const data = await retry(url);
                const fresh = (Array.isArray(data) ? data : [data]).filter(x => x && x.urun_linki);

                for (const oldRow of rows) {
                  const f = match(oldRow, fresh);
                  out.push(f ? {
                    ...oldRow,
                    sku: oldRow.sku || f.sku || '',
                    ean: oldRow.ean || f.ean || '',
                    guncel_fiyat: f.guncel_fiyat ?? oldRow.guncel_fiyat,
                    usd_kdv_haric: f.usd_kdv_haric ?? oldRow.usd_kdv_haric,
                    eur_kdv_haric: f.eur_kdv_haric ?? oldRow.eur_kdv_haric,
                    stok: f.stok ?? oldRow.stok
                  } : oldRow);
                }

                console.log(`${i}/${groups.size} OK`);
              } catch (e) {
                console.log(`${i}/${groups.size} atlandi: ${e.message.slice(0,120)}`);
                out.push(...rows);
              }

              await wait(rnd(12000,20000));
            }

            const now = new Date().toISOString();

            await setKV(slug, {
              ...old,
              brand: old.brand || slug,
              guncelleme: now,
              updated_at: now,
              mode: 'slow-refresh',
              urunler: out
            });

            console.log(`Bitti: ${slug} / ${out.length} satir`);
          }

          run(M || pick()).catch(e => {
            console.error(e);
            process.exit(1);
          });
          JS
