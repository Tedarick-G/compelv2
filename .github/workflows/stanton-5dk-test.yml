name: Stanton 12 Test

on:
  schedule:
    - cron: '0 9 * * *'   # 12:00 TR
  workflow_dispatch:

jobs:
  stanton_test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Stanton KV Refresh Test
        env:
          WORKER: ${{ secrets.WORKER_URL }}
        run: |
          node << 'JS'
          const WORKER = (process.env.WORKER || '').replace(/\/+$/, '');
          const SLUG = 'stanton';
          const DELAY = 3000;

          const DYN_FIELDS = 'urun_linki,varyant_adi,sku,ean,guncel_fiyat,usd_kdv_haric,eur_kdv_haric,stok';
          const FULL_FIELDS = 'sira_no,urun_linki,kapak_gorsel,urun_adi,varyant_adi,sku,ean,marka_adi,kategori_adi,guncel_fiyat,usd_kdv_haric,eur_kdv_haric,stok';

          if (!WORKER) throw new Error('WORKER_URL secret eksik');

          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function fetchJson(url, opt = {}) {
            const r = await fetch(url, opt);
            const text = await r.text();

            console.log(`[HTTP ${r.status}] ${url}`);

            if (!r.ok) {
              throw new Error(`HTTP ${r.status}: ${text.slice(0,300)}`);
            }

            try {
              return JSON.parse(text);
            } catch {
              throw new Error(`JSON okunamadi: ${text.slice(0,300)}`);
            }
          }

          async function readKV(slug) {
            const r = await fetch(`${WORKER}?get=${encodeURIComponent(slug)}`);
            const text = await r.text();

            console.log(`[KV get] ${slug} HTTP ${r.status}`);

            if (r.status === 404) return null;

            if (!r.ok) {
              throw new Error(`KV get HTTP ${r.status}: ${text.slice(0,300)}`);
            }

            try {
              return JSON.parse(text);
            } catch {
              return null;
            }
          }

          async function writeKV(slug, data) {
            await fetchJson(`${WORKER}?set=${encodeURIComponent(slug)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            });
          }

          function groupByLink(rows) {
            const map = new Map();

            for (const u of rows || []) {
              if (!u.urun_linki) continue;

              if (!map.has(u.urun_linki)) {
                map.set(u.urun_linki, []);
              }

              map.get(u.urun_linki).push(u);
            }

            return map;
          }

          function norm(v) {
            return String(v || '')
              .toLowerCase()
              .replace(/\s+/g, ' ')
              .trim();
          }

          function findFreshRow(oldRow, freshRows) {
            if (!freshRows.length) return null;

            if (oldRow.sku) {
              const bySku = freshRows.find(r => String(r.sku || '') === String(oldRow.sku || ''));
              if (bySku) return bySku;
            }

            if (oldRow.ean) {
              const byEan = freshRows.find(r => String(r.ean || '') === String(oldRow.ean || ''));
              if (byEan) return byEan;
            }

            if (oldRow.varyant_adi) {
              const byVar = freshRows.find(r => norm(r.varyant_adi) === norm(oldRow.varyant_adi));
              if (byVar) return byVar;
            }

            return freshRows.length === 1 ? freshRows[0] : null;
          }

          async function rebuildMarka(slug) {
            console.log(`REBUILD: ${slug}`);

            const linkData = await fetchJson(`${WORKER}?u=${encodeURIComponent(slug)}&fields=urun_linki`);
            const links = (linkData.urunler || [])
              .map(x => x.urun_linki)
              .filter(Boolean);

            console.log(`${links.length} urun linki bulundu`);

            const urunler = [];

            for (let i = 0; i < links.length; i++) {
              const link = links[i];

              try {
                const data = await fetchJson(`${WORKER}?u=${encodeURIComponent(link)}&fields=${encodeURIComponent(FULL_FIELDS)}`);
                const rows = Array.isArray(data) ? data : [data];

                urunler.push(...rows.filter(x => x && x.urun_linki));

                console.log(`${i + 1}/${links.length} OK: ${rows[0]?.urun_adi || link}`);
              } catch (e) {
                console.warn(`Urun okunamadi: ${link} - ${e.message}`);
              }

              await sleep(DELAY);
            }

            const now = new Date().toISOString();

            const body = {
              brand: slug,
              marka_linki: linkData.marka_linki || '',
              toplam_bulunan_urun_linki: links.length,
              guncelleme: now,
              updated_at: now,
              mode: 'rebuild',
              urunler
            };

            await writeKV(slug, body);

            console.log(`KV rebuild yazildi: ${urunler.length} satir`);

            return body;
          }

          async function refreshMarka(slug, oldData) {
            console.log(`REFRESH: ${slug}`);

            const oldRows = oldData.urunler || [];
            const groups = groupByLink(oldRows);
            const finalRows = [];

            let i = 0;

            for (const [link, rows] of groups) {
              i++;

              try {
                const data = await fetchJson(`${WORKER}?u=${encodeURIComponent(link)}&fields=${encodeURIComponent(DYN_FIELDS)}`);
                const freshRows = (Array.isArray(data) ? data : [data])
                  .filter(x => x && x.urun_linki);

                for (const oldRow of rows) {
                  const fresh = findFreshRow(oldRow, freshRows);

                  if (!fresh) {
                    finalRows.push(oldRow);
                    continue;
                  }

                  finalRows.push({
                    ...oldRow,
                    sku: oldRow.sku || fresh.sku || '',
                    ean: oldRow.ean || fresh.ean || '',
                    guncel_fiyat: fresh.guncel_fiyat ?? oldRow.guncel_fiyat,
                    usd_kdv_haric: fresh.usd_kdv_haric ?? oldRow.usd_kdv_haric,
                    eur_kdv_haric: fresh.eur_kdv_haric ?? oldRow.eur_kdv_haric,
                    stok: fresh.stok ?? oldRow.stok
                  });
                }

                console.log(`${i}/${groups.size} guncellendi: ${rows[0]?.urun_adi || link}`);
              } catch (e) {
                console.warn(`Guncellenemedi: ${link} - ${e.message}`);
                finalRows.push(...rows);
              }

              await sleep(DELAY);
            }

            const now = new Date().toISOString();

            const body = {
              ...oldData,
              brand: slug,
              guncelleme: now,
              updated_at: now,
              mode: 'refresh',
              urunler: finalRows
            };

            await writeKV(slug, body);

            console.log(`KV refresh yazildi: ${finalRows.length} satir`);

            return body;
          }

          async function main() {
            console.log(`WORKER: ${WORKER}`);
            console.log(`MARKA: ${SLUG}`);
            console.log('Saat 12 Stanton otomatik test basladi');

            const oldData = await readKV(SLUG);

            if (!oldData || !(oldData.urunler || []).length) {
              console.log('KV yok veya bos, rebuild yapilacak');
              await rebuildMarka(SLUG);
            } else {
              console.log(`KV bulundu: ${(oldData.urunler || []).length} satir`);
              await refreshMarka(SLUG, oldData);
            }

            console.log('Tamamlandi');
          }

          main().catch(e => {
            console.error(e);
            process.exit(1);
          });
          JS
